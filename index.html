<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>El Pollo Loco</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./models/drawable-object.class.js"></script>
    <script src="./models/movable-object.class.js"></script>
    <script src="./models/character.class.js"></script>
    <script src="./models/chicken.class.js"></script>
    <script src="./models/cloud.class.js"></script>
    <script src="./models/status-bar.class.js"></script>
    <script src="./models/world.class.js"></script>
    <script src="./models/background-object.class.js"></script>
    <script src="./models/keyboard.class.js"></script>
    <script src="./models/level.class.js"></script>
    <script src="./models/throwable-object-class.js"></script>
    <script src="./models/endboss.class.js"></script>
    <script src="./models/collectable-object.class.js"></script>
    <script src="./levels/level1.js"></script>
    <script src="./js/game.js"></script>
  </head>
  <body onload="init()">
    <h1>El Pollo Loco</h1>

    <div class="game">
      <canvas id="canvas" width="720" height="420"> </canvas>

      <div class="controls">
        <div class="control">
          <svg width="22" height="22" viewBox="0 0 24 24">
            <rect x="1" y="1" width="22" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M14 7l-5 5 5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <svg width="22" height="22" viewBox="0 0 24 24">
            <rect x="1" y="1" width="22" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M10 7l5 5-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Run</span>
        </div>

        <div class="control">
          <svg width="44" height="22" viewBox="0 0 48 24">
            <rect x="1" y="1" width="46" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2" />
            <path d="M15 10v4h18v-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
          </svg>
          <span>Jump</span>
        </div>

        <div class="control">
          <svg width="22" height="22" viewBox="0 0 24 24">
            <rect x="1" y="1" width="22" height="22" rx="4" fill="none" stroke="currentColor" stroke-width="2" />
            <text x="12" y="16.5" text-anchor="middle" font-size="13" font-weight="bold" font-family="Arial, sans-serif" fill="currentColor">D</text>
          </svg>
          <span>Throw</span>
        </div>
      </div>
    </div>
  </body>
</html>
